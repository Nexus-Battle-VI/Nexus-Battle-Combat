name: CI

on:
  # Sin filtro de rama destino: se valida TODO pull request, tambien los que
  # apuntan a `develop` o a otra rama de trabajo.
  #
  # Con el filtro anterior, un PR hacia `develop` no ejecutaba NINGUNA
  # comprobacion. Y `develop` esta protegida exigiendo `Calidad y pruebas`:
  # comprobaciones que nunca se reportaban, de modo que el PR no podia
  # satisfacer su propia proteccion y quedaba bloqueado sin explicacion.
  #
  # El `push` si se limita a `main`, que es la unica rama que publica imagen.
  pull_request:
  push:
    branches: [main]

# El token del workflow solo necesita leer el repositorio. El unico job que
# necesita mas es `publish`, y lo pide para si mismo. Ninguna etapa despliega
# infraestructura desde CI.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.19.0'

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      # Este servicio usa TypeScript 5.9 porque el Nest CLI 11 depende de esa
      # version de forma directa. Vease ADR-002.
      - name: Verificacion de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas de integracion
        run: npm run test:integration

      # Estas pruebas levantan MongoDB en un contenedor con Testcontainers y
      # ejercitan el adaptador contra el motor REAL. Estan fuera de `npm test`
      # para que quien trabaja en el dominio no necesite Docker, pero el CI las
      # ejecuta siempre: un esquema equivocado solo se detecta aqui.
      - name: Pruebas contra MongoDB real
        run: npm run test:db

      - name: Cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combat
          path: coverage/
          retention-days: 7

      - name: Compilar el servicio
        run: npm run build

  ai-pipeline:
    name: Pipeline de dataset y entrenamiento IA (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Independiente del job `quality` (Node): ai/ es un paquete Python aislado
    # (EN-036.2 #566 + EN-036.3 #567) que no comparte dependencias ni build
    # con el servicio Node. El smoke de entrenamiento (#567 §92-94) usa
    # EXCLUSIVAMENTE el dataset sintetico de tests/fixtures/training/ --
    # nunca Mongo real, nunca datos de jugadores.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version de uv fijada explicitamente (#566 §73): la misma resuelta y
      # validada localmente contra Python 3.13 (ver docs/en-036-ai-dataset-pipeline.md).
      #
      # Instalado con el script oficial en vez de `astral-sh/setup-uv`: el
      # allowlist de Actions de la organizacion solo permite `actions/*`,
      # `docker/*`, `github/codeql-action/*` o acciones propias de
      # Nexus-Battle-VI, y una accion de terceros fuera de esa lista hace que
      # GitHub rechace el workflow ENTERO antes de programar ningun job
      # (`startup_failure`, cero jobs, sin logs que lo expliquen).
      - name: Instalar uv
        env:
          UV_VERSION: '0.9.17'
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias (uv.lock, frozen)
        working-directory: ai
        run: uv sync --frozen

      - name: Lint (ruff)
        working-directory: ai
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pruebas Python
        working-directory: ai
        run: uv run pytest -q

      - name: Smoke de construccion del dataset (fixtures, nunca datos reales)
        working-directory: ai
        run: |
          uv run nexus-combat-dataset build \
            --source jsonl \
            --events tests/fixtures/decision-events.jsonl \
            --labels tests/fixtures/teacher-labels.jsonl \
            --output /tmp/ai-dataset-ci \
            --cutoff 2027-01-01T00:00:00Z \
            --source-commit "${{ github.sha }}" \
            --seed 42

      - name: Smoke de PyTorch (import + DataLoader, sin entrenar)
        working-directory: ai
        run: |
          uv run python -c "
          import torch, numpy
          print('torch', torch.__version__, 'cuda:', torch.cuda.is_available())
          print('numpy', numpy.__version__)
          "

      # EN-036.3 (#567 §92-94): dataset de ENTRENAMIENTO sintetico (distinto
      # del de arriba: tiene un battleId por cada split real de
      # battle-hash-split-v1, el otro cae entero en TRAIN y dejaria test
      # vacio) -> training completo -> ONNX -> checker. Artifact SMOKE_TEST,
      # nunca CANDIDATE (#567 §149): este dataset es sintetico, no real.
      - name: 'Smoke de entrenamiento: construir el dataset de training (fixtures)'
        working-directory: ai
        run: |
          uv run nexus-combat-dataset build \
            --source jsonl \
            --events tests/fixtures/training/decision-events.jsonl \
            --labels tests/fixtures/training/teacher-labels.jsonl \
            --output /tmp/ai-training-dataset-ci \
            --cutoff 2027-01-01T00:00:00Z \
            --source-commit "${{ github.sha }}" \
            --seed 42

      - name: 'Smoke de entrenamiento: nexus-combat-train + export ONNX'
        working-directory: ai
        run: |
          uv run nexus-combat-train \
            --dataset-dir /tmp/ai-training-dataset-ci \
            --output /tmp/ai-training-artifacts-ci \
            --source-commit "${{ github.sha }}" \
            --seed 42

      - name: 'Smoke de entrenamiento: verificar artefactos + ONNX checker'
        working-directory: ai
        run: |
          run_dir="$(find /tmp/ai-training-artifacts-ci -mindepth 1 -maxdepth 1 -type d)"
          echo "run_dir=${run_dir}" >> "$GITHUB_ENV"
          for f in model.pt model.onnx training-manifest.json metrics.json feature-schema.json; do
            test -s "${run_dir}/${f}" || { echo "FALLO: falta o esta vacio ${f}"; exit 1; }
          done
          uv run python -c "
          import json, onnx, sys
          run_dir = '${run_dir}'
          onnx.checker.check_model(onnx.load(f'{run_dir}/model.onnx'))
          manifest = json.load(open(f'{run_dir}/training-manifest.json'))
          assert manifest['artifactPurpose'] == 'SMOKE_TEST', manifest['artifactPurpose']
          assert manifest['featureDimension'] == 72, manifest['featureDimension']
          assert manifest['onnxOpsetVersion'] == 18, manifest['onnxOpsetVersion']
          print('onnx checker OK, manifest OK, run_id=', run_dir.rsplit('/', 1)[-1])
          "

      # EN-036.5 (#569 §86-98, §163): referencia de paridad PyTorch sobre el
      # MISMO checkpoint, para que `ai-evaluation-smoke` (job de abajo) la
      # compare contra el runtime REAL de Node (`onnxruntime-node`) sin que
      # Python necesite instalar `onnxruntime`.
      - name: 'Smoke de entrenamiento: generar pytorch-parity-reference.json'
        working-directory: ai
        run: |
          uv run nexus-combat-parity-reference \
            --artifact-dir "${{ env.run_dir }}" \
            --output "${{ env.run_dir }}/pytorch-parity-reference.json"

      - name: Publicar artefactos del smoke de entrenamiento
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-mlp-v1-smoke
          path: ${{ env.run_dir }}
          retention-days: 7

      # EN-037.3 (#572): fixture de INGENIERIA aislado para probar el flujo
      # CANDIDATE -> evaluacion real -> PASS/FAIL -> ACTIVE/REJECTED. Usa el
      # dataset sintetico de CI y por eso NUNCA se publica ni cuenta como
      # evidencia competitiva; solo vive como artifact efimero de este run.
      - name: 'E2E EN-037.3: entrenar CANDIDATE sintetico aislado'
        working-directory: ai
        run: |
          uv run nexus-combat-train \
            --dataset-dir /tmp/ai-training-dataset-ci \
            --output /tmp/ai-en037-candidate-artifacts-ci \
            --source-commit "${{ github.sha }}-synthetic-en037-e2e" \
            --seed 43 \
            --artifact-purpose CANDIDATE
          candidate_run_dir="$(find /tmp/ai-en037-candidate-artifacts-ci -mindepth 1 -maxdepth 1 -type d)"
          echo "candidate_run_dir=${candidate_run_dir}" >> "$GITHUB_ENV"
          uv run nexus-combat-parity-reference \
            --artifact-dir "${candidate_run_dir}" \
            --output "${candidate_run_dir}/pytorch-parity-reference.json"

      - name: Publicar CANDIDATE sintetico aislado para E2E EN-037.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-mlp-v1-en037-e2e
          path: ${{ env.candidate_run_dir }}
          retention-days: 1

  ai-evaluation-smoke:
    name: Evaluacion de politicas de IA (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, ai-pipeline]

    # EN-036.5 (#569 §117-121, §164-165): harness OFFLINE, no necesita
    # esperar al job `docker` (la compatibilidad Docker de onnxruntime-node
    # ya la cubre #568) -- corre en paralelo. Smoke de INGENIERIA: pocas
    # semillas, MCTS con rollouts reducidos (el propio CLI los baja cuando
    # `--purpose SMOKE_TEST`), nunca evidencia de calidad (#569 §74, §119).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el servicio
        run: npm run build

      - name: Descargar el artefacto SMOKE_TEST de ai-pipeline
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-mlp-v1-smoke
          path: /tmp/neural-smoke-artifact

      - name: Descargar el CANDIDATE aislado para E2E EN-037.3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-mlp-v1-en037-e2e
          path: /tmp/neural-candidate-e2e-artifact

      # Paridad PyTorch<->ONNX + escenarios + los 6 matchups + reportes,
      # con una muestra pequena -- el harness entero, no un subconjunto
      # de su logica (#569 §118).
      - name: Correr evaluacion SMOKE (paridad + mirror pairs + 4 politicas)
        run: |
          node dist/infrastructure/evaluation/run-ai-evaluation.js \
            --artifact-dir /tmp/neural-smoke-artifact \
            --output /tmp/evaluation-out-smoke \
            --purpose SMOKE_TEST \
            --seed-start 3000000 \
            --seed-count 2 \
            --mcts-seed-count 2 \
            --max-plies 300 \
            --allow-smoke-model

      # #569 §79, §82, §186: misma config/modelo/seeds -> mismo
      # matchesSha256. Se corre una SEGUNDA vez y se compara, en vez de
      # confiar en que "deberia" ser determinista.
      - name: Verificar reproducibilidad (correr de nuevo y comparar matchesSha256)
        run: |
          node dist/infrastructure/evaluation/run-ai-evaluation.js \
            --artifact-dir /tmp/neural-smoke-artifact \
            --output /tmp/evaluation-out-smoke-b \
            --purpose SMOKE_TEST \
            --seed-start 3000000 \
            --seed-count 2 \
            --mcts-seed-count 2 \
            --max-plies 300 \
            --allow-smoke-model
          hash_a="$(node -p "require('/tmp/evaluation-out-smoke/summary.json').fingerprints.matchesSha256")"
          hash_b="$(node -p "require('/tmp/evaluation-out-smoke-b/summary.json').fingerprints.matchesSha256")"
          echo "matchesSha256 A=${hash_a} B=${hash_b}"
          [ "$hash_a" = "$hash_b" ]

      - name: E2E EN-037.3 (registry, harness real, gates y activacion/rechazo)
        env:
          AI_EN037_E2E_ARTIFACT_DIR: /tmp/neural-candidate-e2e-artifact
        run: npm run test:e2e:en-037

      - name: Publicar reporte de evaluacion (smoke)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-evaluation-smoke
          path: /tmp/evaluation-out-smoke/
          retention-days: 7

  docker:
    name: Imagen del servicio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, ai-pipeline]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Este job solo construye y verifica. Publicar es trabajo de `publish`, que
      # solo se ejecuta desde `main` y depende de que este termine en verde.
      - name: Construir imagen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: nexus-battle-combat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # EN-036.4 (#568 §63-67, §151-154): el artefacto NUNCA se re-entrena en
      # este job. Se reutiliza el SMOKE_TEST que `ai-pipeline` ya produjo y
      # publico en este mismo run (mismo commit), se monta de solo lectura y
      # se valida con el MISMO validador que corre en produccion
      # (`validate-neural-artifact.js`), dentro de la imagen REAL recien
      # construida -- nunca un script aparte que reimplemente la carga.
      - name: Descargar el artefacto SMOKE_TEST de ai-pipeline
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-mlp-v1-smoke
          path: /tmp/neural-smoke-artifact

      # El artefacto de `ai-pipeline` es SMOKE_TEST a proposito (entrenado con
      # datos sinteticos de fixtures, #567 §149): por eso
      # NEURAL_ALLOW_SMOKE_MODEL=true aqui. La carga sigue rechazando
      # SMOKE_TEST si NODE_ENV=production (NeuralModelArtifactLoader), asi
      # que esta prueba corre con NODE_ENV=development, igual que el spike
      # manual que valido esta misma imagen antes del PR.
      - name: Verificar artefacto neuronal dentro de la imagen (EN-036.4 #568)
        run: |
          docker run --rm \
            -v /tmp/neural-smoke-artifact:/models:ro \
            -e NODE_ENV=development \
            -e NEURAL_POLICY_ENABLED=true \
            -e NEURAL_MODEL_ONNX_PATH=/models/model.onnx \
            -e NEURAL_MODEL_MANIFEST_PATH=/models/training-manifest.json \
            -e NEURAL_ALLOW_SMOKE_MODEL=true \
            nexus-battle-combat:ci node dist/infrastructure/ai/validate-neural-artifact.js

      # La imagen corre con NODE_ENV=production, y en produccion el servicio se
      # NIEGA a arrancar sin verificacion de identidad (ADR-004). La prueba de
      # humo aporta configuracion de autenticacion en lugar de rebajar la regla.
      - name: Verificar que la imagen se NIEGA a arrancar sin autenticacion
        run: |
          if docker run --rm nexus-battle-combat:ci 2>&1 | grep -q 'AUTH_MODE'; then
            echo "Correcto: la imagen de produccion no arranca sin AUTH_MODE."
          else
            echo "FALLO: la imagen arranco sin verificacion de identidad."
            exit 1
          fi

      # La imagen de produccion se niega a arrancar con persistencia en memoria
      # (ADR-019): el estado del contexto no puede perderse al reiniciar. Por eso
      # la prueba de arranque levanta un MongoDB real, y la readiness
      # comprueba de verdad que el servicio llega al motor.
      - name: Verificar que la imagen se NIEGA a arrancar sin persistencia duradera
        run: |
          if docker run --rm -e AUTH_MODE=jwt -e COGNITO_USER_POOL_ID=us-east-1_ci -e COGNITO_CLIENT_ID=cliente-ci nexus-battle-combat:ci 2>&1 | grep -q 'PERSISTENCE_DRIVER'; then
            echo "Correcto: la imagen de produccion no arranca con persistencia en memoria."
          else
            echo "FALLO: la imagen arranco sin persistencia duradera."
            exit 1
          fi

      - name: Verificar arranque del contenedor contra MongoDB real
        run: |
          docker network create combat-ci > /dev/null
          docker run -d --name combat-ci-db --network combat-ci mongo:8.0 > /dev/null
          for attempt in $(seq 1 30); do
            if docker exec combat-ci-db mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          url='mongodb://combat-ci-db:27017/combat'
          # ACCOUNT_SERVICE_BASE_URL, PLAYER_INVENTORY_SERVICE_BASE_URL,
          # CATALOG_SERVICE_BASE_URL y WALLET_SERVICE_BASE_URL son obligatorias
          # en produccion desde HU-15.2/HU-22/HU-93.1 (vease env.ts). Los valores siguen la convencion de
          # Nexus-Battle-Infrastructure (compose.example.yml / nodes/app.yml,
          # puerto 3009 para Wallet segun ADR-019): no se resuelven de verdad
          # en esta red de CI, pero la readiness solo depende de MongoDB, asi
          # que basta con que el arranque pase la validacion de configuracion.
          docker run --rm --network combat-ci -e AUTH_MODE=jwt -e COGNITO_USER_POOL_ID=us-east-1_ci -e COGNITO_CLIENT_ID=cliente-ci -e PERSISTENCE_DRIVER=mongo -e MONGODB_URI="$url" -e ACCOUNT_SERVICE_BASE_URL=http://account:3000 -e PLAYER_INVENTORY_SERVICE_BASE_URL=http://inventory:3002 -e CATALOG_SERVICE_BASE_URL=http://catalog:3003 -e WALLET_SERVICE_BASE_URL=http://wallet:3009 nexus-battle-combat:ci node dist/infrastructure/persistence/migrate.js
          docker run -d --name combat-ci --network combat-ci -p 3006:3006 -e AUTH_MODE=jwt -e COGNITO_USER_POOL_ID=us-east-1_ci -e COGNITO_CLIENT_ID=cliente-ci -e PERSISTENCE_DRIVER=mongo -e MONGODB_URI="$url" -e ACCOUNT_SERVICE_BASE_URL=http://account:3000 -e PLAYER_INVENTORY_SERVICE_BASE_URL=http://inventory:3002 -e CATALOG_SERVICE_BASE_URL=http://catalog:3003 -e WALLET_SERVICE_BASE_URL=http://wallet:3009 nexus-battle-combat:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3006/api/health/ready > /dev/null; then
              echo "readiness correcta en el intento ${attempt}"
              curl -fsS http://127.0.0.1:3006/api/health/ready
              curl -fsS http://127.0.0.1:3006/api/version
              exit 0
            fi
            sleep 2
          done
          echo "El contenedor no alcanzo el estado ready"
          docker logs combat-ci
          exit 1

      # Control de la anterior: sin motor, la readiness DEBE responder 503. Si
      # respondiera 200, la prueba de arriba pasaria por construccion.
      - name: Verificar que la readiness falla cuando el motor cae
        run: |
          docker stop combat-ci-db > /dev/null
          # `|| true`: si el servicio murio con el motor, curl no conecta y sale
          # con 7. Eso tambien es un fallo, pero debe verse como tal y con los
          # registros del contenedor, no como un error opaco del paso.
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3006/api/health/ready || true)"
          if [ "$status" = "503" ]; then
            echo "Correcto: readiness 503 sin base de datos."
          else
            echo "FALLO: readiness respondio '${status}' sin base de datos."
            docker logs combat-ci || true
          fi
          docker rm -f combat-ci combat-ci-db > /dev/null
          docker network rm combat-ci > /dev/null
          [ "$status" = "503" ]

  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    # Solo desde `main`, nunca desde un pull request. Si un PR pudiera publicar,
    # cualquiera capaz de abrir uno escribiria en el registro de la organizacion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # `packages: write` se concede AQUI y no en la cabecera del fichero. Los
    # demas jobs no lo necesitan, y un permiso que abarca todo el workflow deja
    # de estar asociado al paso que lo usa.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Iniciar sesion en GHCR
        env:
          REGISTRO_USUARIO: ${{ github.actor }}
          REGISTRO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRO_TOKEN" | docker login ghcr.io -u "$REGISTRO_USUARIO" --password-stdin

      # Tres etiquetas, cada una responde a una pregunta distinta:
      #
      #   latest       lo que la composicion de referencia trae por defecto;
      #   sha-<corto>  de que commit exacto salio la imagen, sin ambiguedad;
      #   <semver>     que version declara el paquete, la misma que sirve /version.
      #
      # El propietario se pasa a minusculas a proposito: GHCR no admite
      # `Nexus-Battle-VI` como ruta de registro y el push fallaria.
      - name: Calcular etiquetas
        id: etiquetas
        env:
          PROPIETARIO: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
        run: |
          imagen="ghcr.io/$(echo "$PROPIETARIO" | tr '[:upper:]' '[:lower:]')/nexus-battle-combat"
          version="$(node -p "require('./package.json').version")"
          {
            echo 'lista<<FIN'
            echo "${imagen}:latest"
            echo "${imagen}:sha-${COMMIT:0:12}"
            echo "${imagen}:${version}"
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"

      # Se reconstruye desde el mismo commit y con la misma cache que el job
      # anterior, asi que el trabajo real es un acierto de cache. Lo que
      # garantiza que se publica algo comprobado no es la cache, sino
      # `needs: docker`: sin ese job en verde, este no llega a ejecutarse.
      - name: Construir y publicar
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Los nodos de la demo son Graviton: `t4g.small` es arm64. Sin esta
          # linea la imagen sale solo para amd64 y el nodo la rechaza con
          # "no matching manifest for linux/arm64/v8".
          #
          # Se construyen las DOS: los portatiles del equipo son amd64 y la
          # composicion de referencia tiene que seguir levantando en ellos.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.etiquetas.outputs.lista }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
